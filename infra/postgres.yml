apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pedal-postgres
  namespace: pedal-club
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: pedal-club
spec:
  selector:
    app: pedal-postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: pedal-club
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: pedal-postgres
  template:
    metadata:
      labels:
        app: pedal-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_USER
              value: pedal
            - name: POSTGRES_DB
              value: pedal
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pedal-db
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            exec:
              command: [pg_isready, -U, pedal]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pedal-postgres

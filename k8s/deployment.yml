apiVersion: apps/v1
kind: Deployment
metadata:
  name: pedal-club
  annotations:
    practica.gitops/validacion: sincronizacion-automatica
  labels:
    app: pedal-club
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pedal-club
  template:
    metadata:
      labels:
        app: pedal-club
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: web
          image: ghcr.io/yvghost/automatizacion_de_la_configuracion_continua:1.0.0
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - name: temporary-files
              mountPath: /tmp
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: pedal-db
                  key: url
            - name: ENABLE_LOAD_TEST
              value: "true"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      volumes:
        - name: temporary-files
          emptyDir:
            sizeLimit: 32Mi
